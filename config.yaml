# political-speech-geometry — single source of truth for every phase.
# All analysis scripts read this file; nothing is hard-coded in src/.
#
# Run 2 (2026-09-23): English corpus (the collector translated the tr/fr/de speeches into English and
# saved them over data/original/), primary model KaLM-Embedding-Gemma3-12B, robustness model
# Qwen3-Embedding-8B. The original-language run is archived under old_results/.

project_name: political-speech-geometry
random_seed: 42

paths:
  data_original: data/original
  data_translated_en: data/translated_en
  data_processed: data/processed
  metadata: data/metadata.csv
  artifacts_embeddings: artifacts/embeddings
  artifacts_clusters: artifacts/clusters
  artifacts_bootstrap: artifacts/bootstrap
  outputs: outputs
  outputs_plots: outputs/plots
  outputs_tables: outputs/tables
  old_results_tables: old_results/outputs/tables   # original-language run, used for the language-effect check

# Leader slug = folder name under data/original/ and filename prefix.
# `language` is the language of the analysed text (now English for everyone);
# `original_language` is the language the speech was delivered in.
leaders:
  erdogan:
    display_name: "Recep Tayyip Erdoğan"
    short_name: "Erdoğan"
    language: en
    original_language: tr
    text_is_translation: true
  macron:
    display_name: "Emmanuel Macron"
    short_name: "Macron"
    language: en
    original_language: fr
    text_is_translation: true
  merkel:
    display_name: "Angela Merkel"
    short_name: "Merkel"
    language: en
    original_language: de
    text_is_translation: true
  putin:
    display_name: "Vladimir Putin"
    short_name: "Putin"
    language: en
    original_language: ru
    text_is_translation: true
    language_note: "Official English transcript of the Russian original"
  trump:
    display_name: "Donald Trump"
    short_name: "Trump"
    language: en
    original_language: en
    text_is_translation: false

corpus:
  min_speeches_per_leader: 3
  target_speeches_per_leader: [3, 5]
  variant: original          # data/original now holds the English texts

# ---------------------------------------------------------------- embeddings
primary_embedding_model: tencent/KaLM-Embedding-Gemma3-12B-2511
robustness_embedding_model: Qwen/Qwen3-Embedding-8B

embedding:
  device: cuda
  normalize: true
  models:
    kalm_embedding_gemma3_12b:
      hf_id: tencent/KaLM-Embedding-Gemma3-12B-2511
      dtype: bfloat16              # 11.76B params ≈ 23.5 GB; fits the 32 GB RTX 5090
      attn_implementation: sdpa
      padding_side: left           # last-token pooling
      trust_remote_code: true
      batch_size: 8
      max_seq_length: 512
      query_instruction_template: "Instruct: {task}\nQuery: {text}"
    qwen3_embedding_8b:
      hf_id: Qwen/Qwen3-Embedding-8B
      dtype: bfloat16
      attn_implementation: sdpa
      padding_side: left
      batch_size: 16
      max_seq_length: 512
      query_instruction_template: "Instruct: {task}\nQuery: {text}"
    bge_m3:
      hf_id: BAAI/bge-m3
      dtype: float16
      batch_size: 32
      max_seq_length: 512
  artifact_pattern: "{model_key}_{unit}"

# ---------------------------------------------------------------- chunking
chunking:
  chunk_min_tokens: 80
  chunk_max_tokens: 180
  chunk_target_tokens: 130
  overlap_tokens: 0
  tokenizer: Qwen/Qwen3-Embedding-8B   # kept from run 1 so both models embed identical chunks
  fallback_tokens_per_word: 1.5
  short_chunk_merge_tolerance: 1.15

# ---------------------------------------------------------------- preprocessing (Phase 1)
preprocess:
  collapse_whitespace: true
  remove_symbol_only_lines: true
  strip_leading_speaker_label: true
  speaker_label_patterns:
    - "^\\W*p?resident of russia vladimir putin\\s*:\\s*"
  remove_stage_directions: true
  remove_html: true
  remove_urls: true
  remove_timestamps: true
  remove_repeated_lines_min_count: 3
  file_rules:
    trump3.txt:
      drop_paragraphs_before_match: "^Chief Justice Roberts, President Carter"
      reason: "oath ceremony and emcee introduction spoken by other people (paragraphs 0-12)"
  ceremonial:
    strip_leading_paragraphs: 1
    strip_trailing_paragraphs: 2
    min_paragraphs_to_apply: 6

# ---------------------------------------------------------------- inventory / validation (Phase 0)
inventory:
  min_words_warn: 400
  near_duplicate_jaccard: 0.5
  fragment_containment: 0.5
  shingle_size: 8
  repeated_line_min_count: 3
  repeated_line_min_chars: 15
  double_space_warn: 20
  language_min_ratio: 0.03

# ---------------------------------------------------------------- geometry / clustering
knn_parameters:
  k: 10
  exclude_same_speech: true

umap_parameters:
  n_neighbors: 15
  min_dist: 0.1
  n_components: 2
  metric: cosine

pca_parameters:
  n_components_visualization: 2
  n_components_clustering: 50

hdbscan_parameters:
  min_cluster_size: 6
  min_samples: 2
  metric: euclidean
  cluster_selection_method: eom

bootstrap_iterations: 2000
bootstrap_confidence_level: 0.95
bootstrap_unit: speech

robustness:
  ceremonial_removal:
    strip_leading_paragraphs: 1
    strip_trailing_paragraphs: 2
  language_effect:
    model_key: qwen3_embedding_8b        # same model in both runs → isolates the language effect
    old_tag: ""                          # in old_results the Qwen3 run carried the primary (plain) filenames

# ---------------------------------------------------------------- theme scoring (Phase 3)
theme_scoring:
  method_primary: embedding_similarity
  method_secondary: zero_shot_nli
  nli_model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  nli_hypothesis_template: "This text is about {}."
  nli_batch_size: 16
  query_task_instruction: "Given a passage from a political speech, retrieve the thematic description that best matches its content"
  query_language: en               # whole corpus is English now (was: matched)
  percentile_reference: all_chunks
  framing_rate_percentile: 0.75
  aggregation:
    chunk_to_speech: mean
    speech_to_leader: mean

theme_definitions:
  - key: national_identity
    label: "National Identity & Unity"
    label_tr: "Ulusal Kimlik ve Birlik"
    description: >-
      The nation as a shared community: references to the homeland, the people, national history
      and heritage, collective memory, national pride, citizens belonging together, and calls for
      national unity and togetherness.
    examples: [nation, homeland, national identity, collective history, national unity, citizens, national belonging]
  - key: security_military
    label: "Security & Military"
    label_tr: "Güvenlik ve Ordu"
    description: >-
      Armed forces, defense, soldiers and veterans, military operations, war and armed conflict,
      terrorism and counter-terrorism, border security, national security threats and the
      protection of the country by force.
    examples: [military, defense, terrorism, war, armed forces, national security, security threats]
  - key: economy_welfare
    label: "Economy & Welfare"
    label_tr: "Ekonomi ve Refah"
    description: >-
      Economic conditions and policy: jobs, employment, wages, growth, inflation and prices,
      industry and production, trade, taxes, public finances, pensions, living standards,
      prosperity and public welfare.
    examples: [economy, jobs, growth, inflation, production, prosperity, living standards, public welfare]
  - key: foreign_policy
    label: "Foreign Policy & Geopolitics"
    label_tr: "Dış Politika ve Jeopolitik"
    description: >-
      Relations with other countries and international organizations: alliances, diplomacy,
      summits, treaties, the global order, other governments and regions, geopolitical
      positioning, and the country's role and influence in the world.
    examples: [international relations, alliances, diplomacy, global order, foreign countries, geopolitical positioning]
  - key: democracy_institutions
    label: "Democracy, Law & Institutions"
    label_tr: "Demokrasi, Hukuk ve Kurumlar"
    description: >-
      Democratic processes and the rule of law: elections and voting, the constitution,
      parliament, courts and the judiciary, civil rights and freedoms, institutions, governance,
      accountability and the legitimacy of power.
    examples: [democracy, elections, constitution, rule of law, institutions, rights, governance]
  - key: social_solidarity
    label: "Social Solidarity & Values"
    label_tr: "Toplumsal Dayanışma ve Değerler"
    description: >-
      Social bonds and shared values: family, community, mutual support, compassion, care for
      the vulnerable, volunteers, faith and traditions, social cohesion, respect and gratitude
      toward fellow citizens.
    examples: [family, solidarity, community, social cohesion, shared values, mutual support]
  - key: crisis_resilience
    label: "Crisis, Threat & Resilience"
    label_tr: "Kriz, Tehdit ve Dayanıklılık"
    description: >-
      Hardship and how it is faced: crises, disasters, pandemics, emergencies, external threats
      and pressures, sacrifice, endurance, resilience, recovery and rebuilding after difficult
      times.
    examples: [crisis, disaster, external threat, hardship, sacrifice, national resilience, recovery]
  - key: future_reform_technology
    label: "Future, Reform & Technology"
    label_tr: "Gelecek, Reform ve Teknoloji"
    description: >-
      Looking ahead and changing course: reforms and modernization, innovation, science and
      technology, digitalization, education and schools, young people, the climate transition
      and long-term plans for the coming years.
    examples: [future, reform, modernization, innovation, technology, education, youth, transformation]

# Rhetorical dimensions ("framing" in the code). The first two are the spec's required metrics and keep
# their exact names; the other five extend the style analysis. All are scored the same way as themes
# (embedding similarity + NLI), aggregated chunk → speech → leader, and reported as sorted descriptive
# measurements with bootstrap intervals — never as normative labels.
framing_definitions:
  conflict_threat_framing:
    label: "Conflict / Threat Framing"
    label_tr: "Çatışma / Tehdit Çerçevesi"
    description: >-
      Language that frames a situation in terms of threat, enemies, conflict, war, attack,
      danger, defense, struggle, confrontation, terror and hostility.
    concepts: [threat, enemy, conflict, war, attack, danger, defense, struggle, confrontation, terror, hostility]
    nli_label: "threat, enemies, conflict and war"
  cooperation_solidarity_framing:
    label: "Cooperation / Solidarity Framing"
    label_tr: "İş Birliği / Dayanışma Çerçevesi"
    description: >-
      Language that frames a situation in terms of cooperation, unity, peace, dialogue,
      solidarity, partnership, reconciliation, mutual support and working together.
    concepts: [cooperation, unity, peace, dialogue, solidarity, partnership, reconciliation, mutual support, working together]
    nli_label: "cooperation, unity, peace and solidarity"
  past_orientation:
    label: "Past Orientation"
    label_tr: "Geçmişe Yönelim"
    description: >-
      Looking back: recalling the year that has ended, history and anniversaries, what was
      achieved, endured or lost, events that already happened and lessons drawn from them.
    concepts: [last year, history, anniversary, we achieved, we endured, remember, what happened, lessons of the past]
    nli_label: "the past, history and what has already happened"
  future_orientation:
    label: "Future Orientation"
    label_tr: "Geleceğe Yönelim"
    description: >-
      Looking ahead: plans, goals and hopes for the coming year and the years after, what will be
      built, changed or achieved, the next steps and the long-term direction.
    concepts: [next year, coming years, we will, plans, goals, vision, tomorrow, the future ahead]
    nli_label: "the future, plans and goals"
  us_vs_them:
    label: "Us-versus-Them Contrast"
    label_tr: "Biz-Onlar Karşıtlığı"
    description: >-
      Drawing a line between an in-group and an out-group: we versus they, our people versus
      opponents, adversaries, elites, foreign powers or other groups portrayed as outsiders or
      as acting against us.
    concepts: [they, those who, against us, our enemies, opponents, outsiders, the others, we alone]
    nli_label: "us versus them, opponents and adversaries"
  gratitude_recognition:
    label: "Gratitude & Recognition"
    label_tr: "Teşekkür ve Takdir"
    description: >-
      Thanking and honouring: gratitude to citizens, workers, soldiers, health workers,
      volunteers and public servants; recognising service, sacrifice and the achievements of
      named groups.
    concepts: [thank you, gratitude, we honour, tribute, recognise, appreciation, dedication, service]
    nli_label: "gratitude and thanking people"
  promises_commitments:
    label: "Promises & Commitments"
    label_tr: "Vaatler ve Taahhütler"
    description: >-
      Making commitments: concrete pledges, announced measures, deadlines, guarantees and
      assurances about what the government or the speaker will do.
    concepts: [we will deliver, I promise, commitment, pledge, measures, guarantee, we are going to, by next year]
    nli_label: "promises and commitments to act"

# ---------------------------------------------------------------- emotional tone (Phase 3b)
# Chunk-level classifier probabilities (English text). Trained on Reddit/Twitter data — domain shift is a
# stated caveat. For translated leaders the scores describe the English translation.
emotion:
  emotion_model: SamLowe/roberta-base-go_emotions        # 28 GoEmotions labels, multi-label sigmoid
  sentiment_model: cardiffnlp/twitter-roberta-base-sentiment-latest   # negative / neutral / positive
  batch_size: 32
  max_length: 512
  families:
    affiliative_positive: [admiration, gratitude, pride, love, caring, joy, optimism, approval, relief, excitement]
    threat_negative: [fear, nervousness, sadness, grief, disappointment, remorse]
    hostility: [anger, annoyance, disgust, disapproval]
    cognitive_other: [realization, curiosity, confusion, surprise, desire, amusement, embarrassment]
    neutral: [neutral]
  family_aggregation: max        # family score of a chunk = highest member-emotion probability
  valence: "P(positive) - P(negative) from the sentiment model"
  report_families: [affiliative_positive, threat_negative, hostility, cognitive_other, neutral]
  family_labels:
    affiliative_positive: "Affiliative / positive emotion"
    threat_negative: "Fear, sadness & loss"
    hostility: "Hostility & disapproval"
    cognitive_other: "Curiosity, surprise & other"
    neutral: "Neutral"

# ---------------------------------------------------------------- composite style similarity (Phase 4c)
style_similarity:
  framing_metric: pct                 # rhetorical dimensions enter as corpus percentiles
  emotion_families: [affiliative_positive, threat_negative, hostility]
  include_valence: true
  standardize: zscore_across_speeches
  distance: euclidean                 # cosine on z-scores also reported
  linkage: average                    # dendrogram ordering

# Diagnostic only (never used as the theme score): keyword hits per theme (English corpus → `en` lists).
theme_keywords_diagnostic:
  national_identity:
    en: [nation, national, homeland, our people, history, heritage, unity, united, citizens, motherland, fatherland]
  security_military:
    en: [military, army, soldiers, defense, defence, war, terror, terrorism, security, armed, troops, veterans]
  economy_welfare:
    en: [economy, economic, jobs, employment, wages, growth, inflation, prices, industry, trade, taxes, prosperity, pension]
  foreign_policy:
    en: [international, allies, alliance, diplomacy, nato, united nations, europe, world, countries, partners, foreign]
  democracy_institutions:
    en: [democracy, democratic, election, elections, constitution, law, rights, freedom, parliament, court, institutions, vote]
  social_solidarity:
    en: [family, families, community, solidarity, together, support, compassion, care, volunteers, faith, values, love]
  crisis_resilience:
    en: [crisis, disaster, pandemic, emergency, threat, hardship, sacrifice, resilience, recover, recovery, rebuild, challenge]
  future_reform_technology:
    en: [future, reform, modernize, innovation, technology, digital, science, education, schools, young, youth, climate, transformation]

# ---------------------------------------------------------------- visualization (Phase 6)
visualization:
  leader_colors:                # reference categorical palette, validated adjacent order; never re-assigned
    erdogan: "#2a78d6"
    macron: "#eb6834"
    merkel: "#1baf7a"
    putin: "#eda100"
    trump: "#e87ba4"
  radar_range: [0.2, 0.8]
  formats:                      # Instagram: square feed post and vertical Reel/Story; pixels at export
    square:   {width_px: 1080, height_px: 1080, suffix: ""}
    vertical: {width_px: 1080, height_px: 1920, suffix: "_9x16"}
  export_scale: 2               # PNG rendered at 2× the pixel size
  base_font_px: 22              # smallest text on a phone screen

methodology_notes:
  projection_note: "2D projections are shown only for visualization; reported similarity values are calculated in the original embedding space."
  interpretation_scope: "All similarity, distance, theme, rhetorical and emotional values describe the collected speech corpora, not ideology, personality, political quality or the people themselves."
  translation_note: "Erdoğan, Macron and Merkel are analysed in English translation and Putin in an official English transcript; for them, style measurements describe the translated text and therefore also carry the translator's choices."

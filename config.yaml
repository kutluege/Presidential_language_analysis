# political-speech-geometry — single source of truth for every phase.
# All analysis scripts read this file; nothing is hard-coded in src/.

project_name: political-speech-geometry
random_seed: 42

paths:
  data_original: data/original
  data_translated_en: data/translated_en
  data_processed: data/processed
  metadata: data/metadata.csv
  artifacts_embeddings: artifacts/embeddings
  artifacts_clusters: artifacts/clusters
  artifacts_bootstrap: artifacts/bootstrap
  outputs: outputs
  outputs_plots: outputs/plots
  outputs_tables: outputs/tables

# Leader slug = folder name under data/original/ and filename prefix.
leaders:
  erdogan:
    display_name: "Recep Tayyip Erdoğan"
    short_name: "Erdoğan"
    language: tr
  macron:
    display_name: "Emmanuel Macron"
    short_name: "Macron"
    language: fr
  merkel:
    display_name: "Angela Merkel"
    short_name: "Merkel"
    language: de
  putin:
    display_name: "Vladimir Putin"
    short_name: "Putin"
    language: en
    language_note: "English transcript of the Russian original"
  trump:
    display_name: "Donald Trump"
    short_name: "Trump"
    language: en

corpus:
  min_speeches_per_leader: 3
  target_speeches_per_leader: [3, 5]
  # Which corpus variant to analyse: "original" (mixed-language) or "translated_en".
  variant: original

# ---------------------------------------------------------------- embeddings
primary_embedding_model: Qwen/Qwen3-Embedding-8B
robustness_embedding_model: BAAI/bge-m3

embedding:
  device: cuda
  normalize: true                 # unit-length before any cosine computation
  models:
    qwen3_embedding_8b:
      hf_id: Qwen/Qwen3-Embedding-8B
      dtype: bfloat16
      attn_implementation: sdpa   # flash_attention_2 has no Windows wheels
      padding_side: left          # required for last-token pooling
      batch_size: 16
      max_seq_length: 512
      # Documents (chunks) are embedded raw; only queries (theme descriptions) get the instruction.
      query_instruction_template: "Instruct: {task}\nQuery: {text}"
    bge_m3:
      hf_id: BAAI/bge-m3
      dtype: float16
      batch_size: 32
      max_seq_length: 512
  # artifacts/embeddings/{model_key}_chunks.npy and {model_key}_index.parquet
  artifact_pattern: "{model_key}_{unit}"

# ---------------------------------------------------------------- chunking
chunking:
  chunk_min_tokens: 80
  chunk_max_tokens: 180
  chunk_target_tokens: 130
  overlap_tokens: 0               # no overlapping windows
  tokenizer: Qwen/Qwen3-Embedding-8B
  fallback_tokens_per_word: 1.5   # used only if the tokenizer cannot be loaded
  short_chunk_merge_tolerance: 1.15  # allow up to 1.15 * max when absorbing a short orphan chunk

# ---------------------------------------------------------------- preprocessing (Phase 1)
# Conservative: only obvious non-speech artifacts are removed, every removal is logged in
# data/processed/preprocessing_report.md, original files are never touched.
preprocess:
  collapse_whitespace: true
  remove_symbol_only_lines: true          # e.g. a lone "*" section separator
  strip_leading_speaker_label: true       # "President of Russia Vladimir Putin:" at file start
  speaker_label_patterns:                 # case-insensitive, anchored at the start of the file
    - "^\\W*p?resident of russia vladimir putin\\s*:\\s*"
  remove_stage_directions: true
  remove_html: true
  remove_urls: true
  remove_timestamps: true
  remove_repeated_lines_min_count: 3
  file_rules:
    trump3.txt:
      drop_paragraphs_before_match: "^Chief Justice Roberts, President Carter"
      reason: "oath ceremony and emcee introduction spoken by other people (paragraphs 0-12)"
  # Robustness variant C: strip ceremonial opening/closing paragraphs before chunking.
  ceremonial:
    strip_leading_paragraphs: 1
    strip_trailing_paragraphs: 2
    min_paragraphs_to_apply: 6

# ---------------------------------------------------------------- inventory / validation (Phase 0)
inventory:
  min_words_warn: 400
  near_duplicate_jaccard: 0.5
  fragment_containment: 0.5
  shingle_size: 8
  repeated_line_min_count: 3
  repeated_line_min_chars: 15
  double_space_warn: 20
  language_min_ratio: 0.03

# ---------------------------------------------------------------- geometry / clustering / viz
knn_parameters:
  k: 10
  exclude_same_speech: true

umap_parameters:
  n_neighbors: 15
  min_dist: 0.1
  n_components: 2
  metric: cosine

pca_parameters:
  n_components_visualization: 2
  n_components_clustering: 50

hdbscan_parameters:
  min_cluster_size: 5
  min_samples: 3
  metric: euclidean
  cluster_selection_method: eom

bootstrap_iterations: 2000
bootstrap_confidence_level: 0.95
bootstrap_unit: speech            # resample speeches within each leader, never chunks

robustness:
  ceremonial_removal:
    strip_leading_paragraphs: 1
    strip_trailing_paragraphs: 2

# ---------------------------------------------------------------- theme scoring (Phase 3)
theme_scoring:
  method_primary: embedding_similarity       # Option A
  method_secondary: zero_shot_nli            # Option B
  nli_model: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
  nli_hypothesis_template: "This text is about {}."
  nli_batch_size: 16
  query_task_instruction: "Given a passage from a political speech, retrieve the thematic description that best matches its content"
  # Primary: each chunk is compared with the theme description written in the chunk's own language
  # (tr/fr/de/en), which removes most of the cross-lingual bias of comparing e.g. Turkish text with an
  # English description. Robustness: English descriptions for every chunk (query_language: en).
  query_language: matched          # matched | en
  percentile_reference: all_chunks # percentiles are computed over the whole corpus, identical for all leaders
  framing_rate_percentile: 0.75    # a chunk "uses" a framing if it sits in the top quartile of the corpus
  aggregation:
    chunk_to_speech: mean
    speech_to_leader: mean        # every speech weighs equally within its leader

theme_definitions:
  - key: national_identity
    label: "National Identity & Unity"
    label_tr: "Ulusal Kimlik ve Birlik"
    description: >-
      The nation as a shared community: references to the homeland, the people, national history
      and heritage, collective memory, national pride, citizens belonging together, and calls for
      national unity and togetherness.
    description_tr: >-
      Ortak bir topluluk olarak millet: vatan, halk, milli tarih ve miras, ortak hafıza, milli gurur,
      vatandaşların birbirine ait olması ve milli birlik ile beraberlik çağrıları.
    description_fr: >-
      La nation comme communauté partagée : références à la patrie, au peuple, à l'histoire et au
      patrimoine national, à la mémoire collective, à la fierté nationale, à l'appartenance des
      citoyens et aux appels à l'unité et au rassemblement national.
    description_de: >-
      Die Nation als gemeinsame Gemeinschaft: Bezüge auf Heimat, Volk, nationale Geschichte und
      Erbe, kollektive Erinnerung, Nationalstolz, Zusammengehörigkeit der Bürgerinnen und Bürger
      sowie Aufrufe zu nationaler Einheit und Zusammenhalt.
    examples: [nation, homeland, national identity, collective history, national unity, citizens, national belonging]
  - key: security_military
    label: "Security & Military"
    label_tr: "Güvenlik ve Ordu"
    description: >-
      Armed forces, defense, soldiers and veterans, military operations, war and armed conflict,
      terrorism and counter-terrorism, border security, national security threats and the
      protection of the country by force.
    description_tr: >-
      Silahlı kuvvetler, savunma, askerler ve gaziler, askeri operasyonlar, savaş ve silahlı çatışma,
      terör ve terörle mücadele, sınır güvenliği, milli güvenlik tehditleri ve ülkenin güç yoluyla
      korunması.
    description_fr: >-
      Forces armées, défense, soldats et anciens combattants, opérations militaires, guerre et
      conflit armé, terrorisme et lutte antiterroriste, sécurité des frontières, menaces pour la
      sécurité nationale et protection du pays par la force.
    description_de: >-
      Streitkräfte, Verteidigung, Soldaten und Veteranen, Militäreinsätze, Krieg und bewaffneter
      Konflikt, Terrorismus und Terrorbekämpfung, Grenzsicherung, Bedrohungen der nationalen
      Sicherheit und der Schutz des Landes mit Gewalt.
    examples: [military, defense, terrorism, war, armed forces, national security, security threats]
  - key: economy_welfare
    label: "Economy & Welfare"
    label_tr: "Ekonomi ve Refah"
    description: >-
      Economic conditions and policy: jobs, employment, wages, growth, inflation and prices,
      industry and production, trade, taxes, public finances, pensions, living standards,
      prosperity and public welfare.
    description_tr: >-
      Ekonomik durum ve politika: iş, istihdam, ücretler, büyüme, enflasyon ve fiyatlar, sanayi ve
      üretim, ticaret, vergiler, kamu maliyesi, emeklilik, hayat standardı, refah ve kamu yararı.
    description_fr: >-
      Situation et politique économiques : emplois, travail, salaires, croissance, inflation et
      prix, industrie et production, commerce, impôts, finances publiques, retraites, niveau de
      vie, prospérité et bien-être collectif.
    description_de: >-
      Wirtschaftliche Lage und Politik: Arbeitsplätze, Beschäftigung, Löhne, Wachstum, Inflation
      und Preise, Industrie und Produktion, Handel, Steuern, öffentliche Finanzen, Renten,
      Lebensstandard, Wohlstand und Gemeinwohl.
    examples: [economy, jobs, growth, inflation, production, prosperity, living standards, public welfare]
  - key: foreign_policy
    label: "Foreign Policy & Geopolitics"
    label_tr: "Dış Politika ve Jeopolitik"
    description: >-
      Relations with other countries and international organizations: alliances, diplomacy,
      summits, treaties, the global order, other governments and regions, geopolitical
      positioning, and the country's role and influence in the world.
    description_tr: >-
      Diğer ülkeler ve uluslararası kuruluşlarla ilişkiler: ittifaklar, diplomasi, zirveler,
      anlaşmalar, küresel düzen, diğer hükümetler ve bölgeler, jeopolitik konumlanma ve ülkenin
      dünyadaki rolü ile etkisi.
    description_fr: >-
      Relations avec les autres pays et les organisations internationales : alliances, diplomatie,
      sommets, traités, ordre mondial, autres gouvernements et régions, positionnement
      géopolitique, rôle et influence du pays dans le monde.
    description_de: >-
      Beziehungen zu anderen Ländern und internationalen Organisationen: Bündnisse, Diplomatie,
      Gipfeltreffen, Verträge, die Weltordnung, andere Regierungen und Regionen, geopolitische
      Positionierung sowie Rolle und Einfluss des Landes in der Welt.
    examples: [international relations, alliances, diplomacy, global order, foreign countries, geopolitical positioning]
  - key: democracy_institutions
    label: "Democracy, Law & Institutions"
    label_tr: "Demokrasi, Hukuk ve Kurumlar"
    description: >-
      Democratic processes and the rule of law: elections and voting, the constitution,
      parliament, courts and the judiciary, civil rights and freedoms, institutions, governance,
      accountability and the legitimacy of power.
    description_tr: >-
      Demokratik süreçler ve hukukun üstünlüğü: seçimler ve oy kullanma, anayasa, meclis, mahkemeler
      ve yargı, haklar ve özgürlükler, kurumlar, yönetişim, hesap verebilirlik ve iktidarın
      meşruiyeti.
    description_fr: >-
      Processus démocratiques et État de droit : élections et vote, constitution, parlement,
      tribunaux et justice, droits et libertés civiques, institutions, gouvernance, responsabilité
      et légitimité du pouvoir.
    description_de: >-
      Demokratische Prozesse und Rechtsstaatlichkeit: Wahlen und Abstimmungen, die Verfassung,
      Parlament, Gerichte und Justiz, Bürgerrechte und Freiheiten, Institutionen, Regierungsführung,
      Rechenschaft und die Legitimität der Macht.
    examples: [democracy, elections, constitution, rule of law, institutions, rights, governance]
  - key: social_solidarity
    label: "Social Solidarity & Values"
    label_tr: "Toplumsal Dayanışma ve Değerler"
    description: >-
      Social bonds and shared values: family, community, mutual support, compassion, care for
      the vulnerable, volunteers, faith and traditions, social cohesion, respect and gratitude
      toward fellow citizens.
    description_tr: >-
      Toplumsal bağlar ve ortak değerler: aile, topluluk, karşılıklı destek, merhamet, kırılgan
      kesimlere sahip çıkma, gönüllüler, inanç ve gelenekler, sosyal uyum, vatandaşlara saygı ve
      şükran.
    description_fr: >-
      Liens sociaux et valeurs partagées : famille, communauté, entraide, compassion, attention
      aux plus fragiles, bénévoles, foi et traditions, cohésion sociale, respect et gratitude
      envers les concitoyens.
    description_de: >-
      Soziale Bindungen und gemeinsame Werte: Familie, Gemeinschaft, gegenseitige Unterstützung,
      Mitgefühl, Fürsorge für Schwache, Ehrenamtliche, Glaube und Traditionen, gesellschaftlicher
      Zusammenhalt, Respekt und Dankbarkeit gegenüber den Mitbürgerinnen und Mitbürgern.
    examples: [family, solidarity, community, social cohesion, shared values, mutual support]
  - key: crisis_resilience
    label: "Crisis, Threat & Resilience"
    label_tr: "Kriz, Tehdit ve Dayanıklılık"
    description: >-
      Hardship and how it is faced: crises, disasters, pandemics, emergencies, external threats
      and pressures, sacrifice, endurance, resilience, recovery and rebuilding after difficult
      times.
    description_tr: >-
      Zorluklar ve bunlarla nasıl başa çıkıldığı: krizler, afetler, salgınlar, acil durumlar, dış
      tehditler ve baskılar, fedakârlık, sabır, dayanıklılık, zor günlerin ardından toparlanma ve
      yeniden inşa.
    description_fr: >-
      Les épreuves et la manière d'y faire face : crises, catastrophes, pandémies, urgences,
      menaces et pressions extérieures, sacrifice, endurance, résilience, redressement et
      reconstruction après des temps difficiles.
    description_de: >-
      Not und ihre Bewältigung: Krisen, Katastrophen, Pandemien, Notlagen, äußere Bedrohungen und
      Druck, Opfer, Durchhalten, Widerstandskraft, Erholung und Wiederaufbau nach schweren Zeiten.
    examples: [crisis, disaster, external threat, hardship, sacrifice, national resilience, recovery]
  - key: future_reform_technology
    label: "Future, Reform & Technology"
    label_tr: "Gelecek, Reform ve Teknoloji"
    description: >-
      Looking ahead and changing course: reforms and modernization, innovation, science and
      technology, digitalization, education and schools, young people, the climate transition
      and long-term plans for the coming years.
    description_tr: >-
      Geleceğe bakmak ve rota değiştirmek: reformlar ve modernleşme, yenilik, bilim ve teknoloji,
      dijitalleşme, eğitim ve okullar, gençler, iklim dönüşümü ve önümüzdeki yıllara dair uzun
      vadeli planlar.
    description_fr: >-
      Regarder vers l'avenir et changer de cap : réformes et modernisation, innovation, science
      et technologie, numérique, éducation et école, jeunesse, transition climatique et projets
      de long terme pour les années à venir.
    description_de: >-
      Nach vorn blicken und den Kurs ändern: Reformen und Modernisierung, Innovation, Wissenschaft
      und Technologie, Digitalisierung, Bildung und Schulen, junge Menschen, der Klimawandel als
      Umbau und langfristige Pläne für die kommenden Jahre.
    examples: [future, reform, modernization, innovation, technology, education, youth, transformation]

framing_definitions:
  conflict_threat_framing:
    label: "Conflict / Threat Framing"
    label_tr: "Çatışma / Tehdit Çerçevesi"
    description: >-
      Language that frames a situation in terms of threat, enemies, conflict, war, attack,
      danger, defense, struggle, confrontation, terror and hostility.
    description_tr: >-
      Bir durumu tehdit, düşman, çatışma, savaş, saldırı, tehlike, savunma, mücadele, hesaplaşma,
      terör ve düşmanlık kavramlarıyla çerçeveleyen dil.
    description_fr: >-
      Un langage qui présente une situation en termes de menace, d'ennemis, de conflit, de guerre,
      d'attaque, de danger, de défense, de lutte, de confrontation, de terreur et d'hostilité.
    description_de: >-
      Sprache, die eine Lage in Begriffen von Bedrohung, Feinden, Konflikt, Krieg, Angriff,
      Gefahr, Verteidigung, Kampf, Konfrontation, Terror und Feindseligkeit rahmt.
    concepts: [threat, enemy, conflict, war, attack, danger, defense, struggle, confrontation, terror, hostility]
  cooperation_solidarity_framing:
    label: "Cooperation / Solidarity Framing"
    label_tr: "İş Birliği / Dayanışma Çerçevesi"
    description: >-
      Language that frames a situation in terms of cooperation, unity, peace, dialogue,
      solidarity, partnership, reconciliation, mutual support and working together.
    description_tr: >-
      Bir durumu iş birliği, birlik, barış, diyalog, dayanışma, ortaklık, uzlaşma, karşılıklı destek
      ve birlikte çalışma kavramlarıyla çerçeveleyen dil.
    description_fr: >-
      Un langage qui présente une situation en termes de coopération, d'unité, de paix, de
      dialogue, de solidarité, de partenariat, de réconciliation, d'entraide et de travail en commun.
    description_de: >-
      Sprache, die eine Lage in Begriffen von Zusammenarbeit, Einheit, Frieden, Dialog,
      Solidarität, Partnerschaft, Versöhnung, gegenseitiger Unterstützung und gemeinsamem Handeln
      rahmt.
    concepts: [cooperation, unity, peace, dialogue, solidarity, partnership, reconciliation, mutual support, working together]

